const http = require("http");

const PORT = process.env.PORT || 10000;
const OPENAI_API_KEY = process.env.OPENAI_API_KEY;

function sendJSON(res, status, data) {
  res.writeHead(status, {
    "Content-Type": "application/json",
    "Access-Control-Allow-Origin": "*",
    "Access-Control-Allow-Headers": "Content-Type",
    "Access-Control-Allow-Methods": "GET,POST,OPTIONS"
  });

  res.end(JSON.stringify(data));
}

const server = http.createServer(async (req, res) => {

  // CORS preflight
  if (req.method === "OPTIONS") {
    sendJSON(res, 200, { ok: true });
    return;
  }

  // Test endpoint
  if (req.method === "GET" && req.url === "/") {
    sendJSON(res, 200, {
      status: "online",
      name: "Kedrick AI",
      developer: "Kedrick Nkole"
    });
    return;
  }

  // Health check
  if (req.method === "GET" && req.url === "/health") {
    sendJSON(res, 200, {
      status: "healthy"
    });
    return;
  }

  // Kedrick AI API
  if (req.method === "POST" && req.url === "/api/kedrick-ai") {

    let body = "";

    req.on("data", chunk => {
      body += chunk;
    });

    req.on("end", async () => {

      try {

        const data = JSON.parse(body);
        const question = data.question;

        if (!question) {
          sendJSON(res, 400, {
            error: "Question is required."
          });
          return;
        }

        if (!OPENAI_API_KEY) {
          sendJSON(res, 500, {
            error: "OPENAI_API_KEY is not configured on Render."
          });
          return;
        }

        const response = await fetch(
          "https://api.openai.com/v1/responses",
          {
            method: "POST",

            headers: {
              "Content-Type": "application/json",
              "Authorization": "Bearer " + OPENAI_API_KEY
            },

            body: JSON.stringify({
              model: process.env.OPENAI_MODEL || "gpt-5-mini",

              instructions:
                "You are Kedrick AI, developed by Kedrick Nkole. " +
                "You are a nursing education assistant specializing in " +
                "nursing, medicine, pharmacology, paediatrics, midwifery, " +
                "psychiatry and community health. " +
                "Give clear explanations suitable for nursing students. " +
                "Do not invent references. " +
                "For medicines, doses and emergencies, advise verification " +
                "against current approved guidelines and facility protocols.",

              input: question
            })
          }
        );

        const result = await response.json();

        if (!response.ok) {
          sendJSON(res, response.status, {
            error: "OpenAI request failed.",
            details: result
          });
          return;
        }

        let answer = "";

        if (result.output_text) {
          answer = result.output_text;
        } else if (result.output) {

          for (const item of result.output) {

            if (item.content) {

              for (const content of item.content) {

                if (content.text) {
                  answer += content.text;
                }

              }
            }
          }
        }

        sendJSON(res, 200, {
          answer: answer || "No answer returned.",
          application: "Kedrick AI",
          developer: "Kedrick Nkole"
        });

      } catch (error) {

        console.error(error);

        sendJSON(res, 500, {
          error: "Kedrick AI backend error.",
          message: error.message
        });

      }

    });

    return;
  }

  sendJSON(res, 404, {
    error: "Endpoint not found."
  });

});

server.listen(PORT, "0.0.0.0", () => {
  console.log("Kedrick AI backend is running on port " + PORT);
});import express from "express";
import cors from "cors";
import OpenAI from "openai";

const app = express();
const PORT = process.env.PORT || 10000;

app.use(cors());
app.use(express.json({ limit: "1mb" }));

app.get("/", (req, res) => {
  res.json({
    ok: true,
    name: "Kedrick AI Backend",
    developer: "Kedrick Nkole",
    status: "online"
  });
});

app.get("/health", (req, res) => {
  res.json({
    ok: true,
    status: "healthy"
  });
});

app.post("/api/kedrick-ai", async (req, res) => {
  try {
    const { question } = req.body;

    if (!question) {
      return res.status(400).json({
        error: "Question is required"
      });
    }

    if (!process.env.OPENAI_API_KEY) {
      return res.status(500).json({
        error: "OPENAI_API_KEY is not configured"
      });
    }

    const openai = new OpenAI({
      apiKey: process.env.OPENAI_API_KEY
    });

    const response = await openai.responses.create({
      model: process.env.OPENAI_MODEL || "gpt-5-mini",

      instructions: `
You are Kedrick AI, developed by Kedrick Nkole.

You are a nursing education assistant specializing in:
- Nursing
- Medicine
- Pharmacology
- Paediatrics
- Midwifery
- Psychiatry
- Community health

Give clear, structured explanations suitable for nursing students.

For medicines, dosages, emergencies and clinical decisions,
always advise the user to verify information against current
approved guidelines and facility protocols.

Do not invent references.
      `,

      input: question
    });

    res.json({
      answer: response.output_text,
      developer: "Kedrick Nkole",
      application: "Kedrick AI"
    });

  } catch (error) {
    console.error(error);

    res.status(500).json({
      error: "Kedrick AI backend error",
      message: error.message
    });
  }
});

app.listen(PORT, "0.0.0.0", () => {
  console.log(`Kedrick AI running on port ${PORT}`);
});
